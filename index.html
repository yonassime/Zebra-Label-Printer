<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILRI Zebra Label Printer</title><style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}h1{margin:0}section{background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:18px;margin:16px 0}.grid{display:flex;gap:16px;flex-wrap:wrap}label{font-weight:650;display:grid;gap:5px}input,textarea,button{font:inherit;border:1px solid #b9c7d8;border-radius:6px;padding:9px}textarea{width:100%;box-sizing:border-box;min-height:160px;font-family:ui-monospace,monospace}button{cursor:pointer;background:#1266d6;color:#fff;border:0;font-weight:650}.secondary{background:#536277}.status{min-height:1.5em;font-weight:650}.ok{color:#08763e}.bad{color:#b42318}.hidden{display:none}pre{max-height:260px;overflow:auto;white-space:pre-wrap;background:#101827;color:#d6e3f5;padding:12px;border-radius:6px}code{background:#edf1f6;padding:2px 4px}table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:left;border-bottom:1px solid #e4eaf1}</style></head><body><main class="wrap"><h1>ILRI Zebra Label Printer</h1><p id="subtitle"></p><section><h2>1. Label type and printer</h2><div class="grid"><label><input type="radio" name="labelType" value="field" checked> Field Label — four across</label><label><input type="radio" name="labelType" value="distribution"> Distribution Label — MTS</label></div><p id="printerInfo"></p><button id="test" class="secondary">Print connection test</button></section><section><h2 id="inputTitle"></h2><label id="duplicatesLabel">Default duplicates<input id="defaultCopies" type="number" min="1" value="1"></label><textarea id="rows" spellcheck="false"></textarea><p id="inputHelp"></p><button id="preview" class="secondary">Validate / preview</button> <button id="download" class="secondary">Download ZPL</button> <button id="print">Send labels to Zebra</button><div id="status" class="status"></div><div id="summary"></div><details><summary>View generated ZPL</summary><pre id="zpl"></pre></details></section></main><script type="module" src="./app.js"></script></body></html>
